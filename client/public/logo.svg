<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Forbidden Fruit">
  <defs>
    <mask id="bite">
      <rect width="128" height="128" fill="#fff"/>
      <circle cx="108" cy="58" r="13" fill="#000"/>
      <circle cx="110" cy="78" r="11" fill="#000"/>
      <circle cx="104" cy="68" r="13" fill="#000"/>
    </mask>
    <radialGradient id="shine" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#ff6a5c"/>
      <stop offset="1" stop-color="#c8102e"/>
    </radialGradient>
  </defs>
  <!-- apple with a bite taken out of the right side -->
  <path mask="url(#bite)" fill="url(#shine)"
        d="M64 36C50 26 22 32 22 66c0 30 22 52 36 48 4-1 8-1 12 0 14 4 36-18 36-48 0-34-28-40-42-30z"/>
  <path d="M64 36c0-10 4-18 10-22" fill="none" stroke="#6b4423" stroke-width="5" stroke-linecap="round"/>
  <path d="M70 24c6-14 22-14 28-10-6 12-20 16-28 10z" fill="#4caf50"/>
  <!-- snake coiled around the apple, head reaching for the bite -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="body" d="M18 100c18 22 52 18 46-4C58 76 28 84 38 64c9-17 38-8 42-26"
          stroke="#14532d" stroke-width="13"/>
    <path d="M18 100c18 22 52 18 46-4C58 76 28 84 38 64c9-17 38-8 42-26"
          stroke="#3fb764" stroke-width="9"/>
    <path d="M18 100c18 22 52 18 46-4C58 76 28 84 38 64c9-17 38-8 42-26"
          stroke="#a7e8b8" stroke-width="2.5" stroke-dasharray="1 8" opacity=".9"/>
  </g>
  <g transform="rotate(-30 88 32)">
    <ellipse cx="88" cy="32" rx="13" ry="9" fill="#14532d"/>
    <ellipse cx="88" cy="32" rx="11" ry="7" fill="#3fb764"/>
    <circle cx="91" cy="29" r="2.6" fill="#fff"/>
    <circle cx="91.8" cy="29" r="1.3" fill="#111"/>
    <path d="M100 32h8l4-3m-4 3l4 3" fill="none" stroke="#e11d48" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
