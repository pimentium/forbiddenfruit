# On every push to main: build the app, pack it into one tarball and upload it to the production server, which
# installs it and restarts the app (rolling back by itself if the new version doesn't start).
# See "Deployment" in README.md for the one-time setup. Nothing is published anywhere: the tarball only goes to the server.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # run by hand (builds and deploys the selected branch head)

# One deployment at a time; a newer push waits for the running one instead of cancelling it half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22        # same major version as the node image on the server
          cache: npm

      - name: Build the client
        env:
          BASE_PATH: ${{ vars.BASE_PATH || '/' }}
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          APP_COMMIT_SHA: ${{ github.sha }}
        run: |
          export APP_COMMIT_DATE="$(git log -1 --format=%cI)"      # shown in the page footer
          npm ci
          npm run build

      - name: Pack the release (the server code, the built client and the production dependencies only)
        run: |
          rm -rf node_modules
          npm ci --omit=dev
          rm -rf node_modules/.bin        # symlinks are not allowed in a release; the server starts tsx by its path
          # --hard-dereference: esbuild hard-links its binary; links are not allowed in a release, so store it as a normal file
          tar --format=gnu --sort=name --owner=0 --group=0 --numeric-owner --hard-dereference -czf release.tar.gz \
            server client/dist node_modules package.json package-lock.json tsconfig.json
          ls -l release.tar.gz
          sha256sum release.tar.gz

      # Skipped (build only) until the server is set up: repository variable DEPLOY_URL, see README.
      - name: Upload the release to the server
        if: vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}              # https://example.com/hooks/forbiddenfruit
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}     # shared HMAC key, same value as on the server
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sign() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | sed 's/^.* //'; }
          digest=$(sha256sum release.tar.gz | cut -d' ' -f1)
          length=$(stat -c %s release.tar.gz)
          for attempt in 1 2 3; do
            ts=$(date +%s)
            if curl -fsS --max-time 300 -X POST -H 'Expect:' \
                 -H "X-Commit: $SHA" -H "X-Timestamp: $ts" -H "X-Content-SHA256: $digest" \
                 -H "X-Signature-256: sha256=$(sign "deploy:$SHA:$ts:$digest:$length")" \
                 -H 'Content-Type: application/gzip' --data-binary @release.tar.gz "$DEPLOY_URL/deploy"; then
              echo; break
            fi
            [ "$attempt" = 3 ] && { echo "::error::The server did not accept the upload"; exit 1; }
            echo "upload failed, trying again"; sleep 10
          done

      - name: Wait for the server to switch (it goes back to the previous version when the new one doesn't start)
        if: vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sign() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | sed 's/^.* //'; }
          for _ in $(seq 60); do
            sleep 5
            ts=$(date +%s)
            out=$(curl -fsS --retry 2 --retry-all-errors --max-time 20 \
              -H "X-Signature-256: sha256=$(sign "status:$SHA:$ts")" \
              "$DEPLOY_URL/status?sha=$SHA&ts=$ts" || true)
            echo "status: $out"
            got=$(printf '%s' "$out" | jq -r '.sha // empty' 2>/dev/null || true)
            state=$(printf '%s' "$out" | jq -r '.state // empty' 2>/dev/null || true)
            # The server reports on its latest request: another commit there means a newer push took over.
            if [ -n "$got" ] && [ "$got" != "$SHA" ]; then
              echo "A newer commit was requested meanwhile; its own run reports the result"; exit 0
            fi
            case "$state" in
              ok)     echo "Deployed $SHA"; exit 0 ;;
              failed) echo "::error::The server could not run $SHA: $(printf '%s' "$out" | jq -r .detail)"; exit 1 ;;
            esac
          done
          echo "::error::No result from the server after 5 minutes"
          exit 1
